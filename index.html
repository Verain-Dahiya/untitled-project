<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petable Automaton AI — The AI That Builds, Automates, Codes, and Executes</title>
    <meta name="description" content="World's most advanced AI automation platform & multi-agent app builder. Generate full-stack apps, workflows, code, and deployments in seconds.">
    <meta property="og:title" content="Petable Automaton AI">
    <meta property="og:description" content="The AI That Builds, Automates, Codes, and Executes. Next-Gen Multi-Agent Autonomous Development.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS & Plugins -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        },
                        purple: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        },
                        dark: {
                            950: '#07090e',
                            900: '#0d1117',
                            850: '#121721',
                            800: '#161b26',
                            750: '#1f2636',
                            700: '#2a3447',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                        'float': 'float 6s ease-in-out infinite',
                        'border-glow': 'borderGlow 3s linear infinite',
                    },
                    keyframes: {
                        glow: {
                            '0%': { opacity: '0.4', filter: 'drop-shadow(0 0 15px rgba(59,130,246,0.5))' },
                            '100%': { opacity: '0.8', filter: 'drop-shadow(0 0 30px rgba(139,92,246,0.8))' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' },
                        },
                        borderGlow: {
                            '0%, 100%': { borderColor: 'rgba(59,130,246,0.4)' },
                            '50%': { borderColor: 'rgba(168,85,247,0.8)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Glassmorphism Custom CSS */
        .glass-panel {
            background: rgba(18, 23, 33, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel-light {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .glass-nav {
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glow-gradient-text {
            background: linear-gradient(135deg, #60A5FA 0%, #A855F7 50%, #EC4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glow-button {
            background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.35);
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(7, 9, 14, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        /* Grid Background Pattern */
        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 font-sans antialiased min-h-screen selection:bg-purple-600 selection:text-white overflow-x-hidden"
      x-data="automatonApp()" 
      x-init="initApp()" 
      @keydown.window.cmd.k.prevent="commandPaletteOpen = true" 
      @keydown.window.ctrl.k.prevent="commandPaletteOpen = true"
      @keydown.escape.window="commandPaletteOpen = false; activeModal = null">

    <!-- Ambient Glowing Background Orbs -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute top-1/3 -right-40 w-[30rem] h-[30rem] bg-purple-600/20 rounded-full blur-[140px] animate-glow"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-cyan-500/15 rounded-full blur-[120px]"></div>
        <div class="absolute inset-0 bg-grid-pattern opacity-60"></div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="relative z-10 flex flex-col min-h-screen">
        
        <!-- TOP NAVIGATION BAR -->
        <header class="sticky top-0 z-40 glass-nav h-16 px-4 lg:px-6 flex items-center justify-between border-b border-white/10">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentView = 'workspace'">
                <div class="relative w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-purple-600 to-pink-500 p-0.5 shadow-lg shadow-purple-500/20 flex items-center justify-center">
                    <div class="w-full h-full bg-dark-900 rounded-[10px] flex items-center justify-center">
                        <i data-lucide="bot" class="w-5 h-5 text-purple-400"></i>
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-extrabold text-lg tracking-tight text-white font-mono">Petable <span class="glow-gradient-text">Automaton</span></span>
                        <span class="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-300 border border-purple-500/30">AI v3.5 Pro</span>
                    </div>
                    <p class="text-[10px] text-slate-400 -mt-1 hidden sm:block">The Autonomous Development Engine</p>
                </div>
            </div>

            <!-- View Navigation Switcher -->
            <nav class="hidden md:flex items-center space-x-1 bg-dark-900/80 p-1 rounded-xl border border-white/10">
                <button @click="currentView = 'workspace'" :class="currentView === 'workspace' ? 'bg-purple-600 text-white font-medium shadow' : 'text-slate-400 hover:text-slate-200'" class="px-3.5 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    <span>Studio Hub</span>
                </button>
                <button @click="currentView = 'agents'" :class="currentView === 'agents' ? 'bg-purple-600 text-white font-medium shadow' : 'text-slate-400 hover:text-slate-200'" class="px-3.5 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                    <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                    <span>16 AI Agents</span>
                </button>
                <button @click="currentView = 'workflow'" :class="currentView === 'workflow' ? 'bg-purple-600 text-white font-medium shadow' : 'text-slate-400 hover:text-slate-200'" class="px-3.5 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                    <i data-lucide="git-merge" class="w-3.5 h-3.5"></i>
                    <span>Workflow Canvas</span>
                </button>
                <button @click="currentView = 'ide'" :class="currentView === 'ide' ? 'bg-purple-600 text-white font-medium shadow' : 'text-slate-400 hover:text-slate-200'" class="px-3.5 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                    <i data-lucide="code-2" class="w-3.5 h-3.5"></i>
                    <span>Code Studio</span>
                </button>
                <button @click="currentView = 'marketplace'" :class="currentView === 'marketplace' ? 'bg-purple-600 text-white font-medium shadow' : 'text-slate-400 hover:text-slate-200'" class="px-3.5 py-1.5 rounded-lg text-xs transition flex items-center space-x-1.5">
                    <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
                    <span>Store</span>
                </button>
            </nav>

            <!-- Top Right Action Controls & User Auth -->
            <div class="flex items-center space-x-3">
                <!-- Search Trigger -->
                <button @click="commandPaletteOpen = true" class="hidden sm:flex items-center space-x-2 bg-dark-900/90 border border-white/10 hover:border-purple-500/50 px-3 py-1.5 rounded-xl text-xs text-slate-400 transition">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400"></i>
                    <span>Search or Command...</span>
                    <kbd class="px-1.5 py-0.5 text-[10px] bg-dark-800 border border-white/10 rounded text-slate-300">⌘K</kbd>
                </button>

                <!-- Project Quick Export -->
                <button @click="exportProject('zip')" class="hidden lg:flex items-center space-x-1.5 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-white/10 text-xs font-medium transition">
                    <i data-lucide="download" class="w-3.5 h-3.5 text-blue-400"></i>
                    <span>Export ZIP</span>
                </button>

                <!-- User Session / Login Button -->
                <template x-if="!userLoggedIn">
                    <button @click="openAuthModal()" class="glow-button px-4 py-1.5 rounded-xl text-xs font-semibold text-white flex items-center space-x-2">
                        <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
                        <span>Sign In</span>
                    </button>
                </template>
                <template x-if="userLoggedIn">
                    <div class="relative" x-data="{ userMenuOpen: false }">
                        <button @click="userMenuOpen = !userMenuOpen" class="flex items-center space-x-2.5 bg-dark-900 border border-white/10 hover:border-purple-500/50 p-1.5 pr-3 rounded-xl transition">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=80&q=80" class="w-7 h-7 rounded-lg object-cover ring-1 ring-purple-500/50" alt="Avatar">
                            <span class="text-xs font-medium text-slate-200 hidden sm:inline">Alex Rivera</span>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
                        </button>

                        <div x-show="userMenuOpen" @click.away="userMenuOpen = false" x-transition class="absolute right-0 mt-2 w-56 glass-panel rounded-2xl shadow-2xl py-2 z-50 border border-white/10">
                            <div class="px-4 py-2 border-b border-white/10">
                                <p class="text-xs font-semibold text-white">Alex Rivera</p>
                                <p class="text-[10px] text-slate-400">alex.rivera@petable.ai</p>
                                <span class="inline-block mt-1 px-2 py-0.5 bg-purple-500/20 text-purple-300 border border-purple-500/30 text-[9px] font-bold rounded">BUSINESS PLAN</span>
                            </div>
                            <button @click="currentView = 'analytics'; userMenuOpen = false" class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-white/5 flex items-center space-x-2">
                                <i data-lucide="bar-chart-3" class="w-3.5 h-3.5 text-purple-400"></i>
                                <span>Analytics & Tokens</span>
                            </button>
                            <button @click="currentView = 'admin'; userMenuOpen = false" class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-white/5 flex items-center space-x-2">
                                <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-cyan-400"></i>
                                <span>Admin Panel</span>
                            </button>
                            <button @click="currentView = 'pricing'; userMenuOpen = false" class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-white/5 flex items-center space-x-2">
                                <i data-lucide="credit-card" class="w-3.5 h-3.5 text-emerald-400"></i>
                                <span>Subscription & Billing</span>
                            </button>
                            <button @click="currentView = 'settings'; userMenuOpen = false" class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-white/5 flex items-center space-x-2">
                                <i data-lucide="sliders" class="w-3.5 h-3.5 text-slate-400"></i>
                                <span>System Settings</span>
                            </button>
                            <div class="border-t border-white/10 my-1"></div>
                            <button @click="userLoggedIn = false; userMenuOpen = false" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-rose-500/10 flex items-center space-x-2">
                                <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                                <span>Sign Out</span>
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </header>

        <!-- MAIN VIEW WRAPPER -->
        <main class="flex-1 flex overflow-hidden relative">

            <!-- ================= VIEW 1: STUDIO HUB / WORKSPACE (MAIN PROMPT & WORKSPACE) ================= -->
            <template x-if="currentView === 'workspace'">
                <div class="flex-1 flex flex-col xl:flex-row h-[calc(100vh-4rem)] overflow-hidden">
                    
                    <!-- Left Column: Prompt Input & Multi-Agent Execution Progress -->
                    <div class="w-full xl:w-2/5 flex flex-col border-b xl:border-b-0 xl:border-r border-white/10 bg-dark-900/60 p-4 lg:p-6 overflow-y-auto">
                        
                        <!-- Main Hero Header -->
                        <div class="mb-6">
                            <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-medium mb-3">
                                <i data-lucide="zap" class="w-3.5 h-3.5 text-purple-400"></i>
                                <span>Autonomous Multi-Agent Orchestration</span>
                            </div>
                            <h1 class="text-2xl lg:text-3xl font-bold text-white tracking-tight">What would you like to build today?</h1>
                            <p class="text-xs lg:text-sm text-slate-400 mt-1">Describe any app, website, Python bot, workflow, or business model. 16 AI agents will build it live.</p>
                        </div>

                        <!-- Prompt Input Box -->
                        <div class="glass-panel p-4 rounded-2xl border border-white/10 shadow-2xl relative mb-6 focus-within:ring-2 focus-within:ring-purple-500/50 transition">
                            <textarea 
                                x-model="userPrompt" 
                                @keydown.enter.prevent="if(!e.shiftKey) runAutomatonGeneration()"
                                rows="3" 
                                class="w-full bg-transparent text-sm text-slate-100 placeholder-slate-500 focus:outline-none resize-none" 
                                placeholder="E.g., Build a complete SaaS landing page with dark mode, interactive pricing simulator, and Stripe API setup..."></textarea>
                            
                            <!-- Prompt Tools Bar -->
                            <div class="flex items-center justify-between pt-3 border-t border-white/10 mt-2">
                                <div class="flex items-center space-x-2 text-slate-400">
                                    <button @click="triggerFileUpload()" class="p-1.5 hover:bg-white/5 rounded-lg hover:text-purple-400 transition" title="Attach PDF, Code, Images">
                                        <i data-lucide="paperclip" class="w-4 h-4"></i>
                                    </button>
                                    <button @click="toggleVoiceMode()" :class="voiceActive ? 'text-red-400 bg-red-500/10' : ''" class="p-1.5 hover:bg-white/5 rounded-lg hover:text-purple-400 transition" title="Voice Input">
                                        <i data-lucide="mic" class="w-4 h-4"></i>
                                    </button>
                                    <button @click="selectAgentPreset()" class="p-1.5 hover:bg-white/5 rounded-lg hover:text-purple-400 transition" title="Select Primary Agent">
                                        <i data-lucide="bot" class="w-4 h-4"></i>
                                    </button>
                                    <span class="text-[11px] text-slate-500 hidden sm:inline" x-text="uploadedFiles.length > 0 ? uploadedFiles.length + ' file attached' : 'No attachments'"></span>
                                </div>

                                <button 
                                    @click="runAutomatonGeneration()" 
                                    :disabled="isGenerating || !userPrompt.trim()"
                                    class="glow-button px-5 py-2 rounded-xl text-xs font-semibold text-white flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                    <template x-if="!isGenerating">
                                        <span class="flex items-center space-x-1.5">
                                            <span>Generate & Execute</span>
                                            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                                        </span>
                                    </template>
                                    <template x-if="isGenerating">
                                        <span class="flex items-center space-x-2">
                                            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                                            <span>Orchestrating...</span>
                                        </span>
                                    </template>
                                </button>
                            </div>
                        </div>

                        <!-- Suggested Quick Prompts -->
                        <div class="mb-6">
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Instant Starter Prompts</p>
                            <div class="grid grid-cols-2 gap-2">
                                <template x-for="starter in starterPrompts" :key="starter.title">
                                    <button @click="userPrompt = starter.prompt; runAutomatonGeneration()" class="p-2.5 rounded-xl glass-panel hover:bg-white/10 text-left border border-white/5 hover:border-purple-500/30 transition group">
                                        <div class="flex items-center space-x-2 mb-1">
                                            <i :data-lucide="starter.icon" class="w-4 h-4 text-purple-400 group-hover:scale-110 transition"></i>
                                            <span class="text-xs font-semibold text-slate-200 group-hover:text-purple-300" x-text="starter.title"></span>
                                        </div>
                                        <p class="text-[11px] text-slate-400 line-clamp-1" x-text="starter.subtitle"></p>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- Multi-Agent Live Progress Stream -->
                        <div class="flex-1 glass-panel rounded-2xl p-4 border border-white/10 flex flex-col">
                            <div class="flex items-center justify-between border-b border-white/10 pb-3 mb-3">
                                <div class="flex items-center space-x-2">
                                    <span class="relative flex h-2.5 w-2.5">
                                      <span :class="isGenerating ? 'animate-ping bg-emerald-400' : 'bg-slate-500'" class="absolute inline-flex h-full w-full rounded-full opacity-75"></span>
                                      <span :class="isGenerating ? 'bg-emerald-500' : 'bg-slate-500'" class="relative inline-flex rounded-full h-2.5 w-2.5"></span>
                                    </span>
                                    <h3 class="text-xs font-semibold text-white uppercase tracking-wider">Agent Pipeline Execution Log</h3>
                                </div>
                                <span class="text-[10px] text-purple-400 font-mono" x-text="isGenerating ? activeAgentStepName : 'Agent Engine Idle'"></span>
                            </div>

                            <!-- Agent Steps Checklist -->
                            <div class="space-y-2 overflow-y-auto max-h-60 pr-1">
                                <template x-for="(step, index) in agentSteps" :key="index">
                                    <div class="flex items-center justify-between text-xs p-2 rounded-lg bg-dark-950/40 border border-white/5">
                                        <div class="flex items-center space-x-2.5">
                                            <div class="w-6 h-6 rounded-md flex items-center justify-center font-mono text-[10px] font-bold"
                                                 :class="step.status === 'completed' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 
                                                         step.status === 'active' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40 animate-pulse' : 
                                                         'bg-slate-800 text-slate-500'">
                                                <template x-if="step.status === 'completed'"><i data-lucide="check" class="w-3.5 h-3.5"></i></template>
                                                <template x-if="step.status === 'active'"><i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i></template>
                                                <template x-if="step.status === 'pending'"><span x-text="index + 1"></span></template>
                                            </div>
                                            <div>
                                                <p class="font-medium text-slate-200" x-text="step.name"></p>
                                                <p class="text-[10px] text-slate-400" x-text="step.agent"></p>
                                            </div>
                                        </div>
                                        <span class="text-[10px] font-mono text-slate-400" x-text="step.time"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>

                    <!-- Right Column: Interactive Live Preview & Code Artifact Split Screen -->
                    <div class="w-full xl:w-3/5 flex flex-col bg-dark-950 relative overflow-hidden">
                        
                        <!-- Top Toolbar for Live Preview -->
                        <div class="h-12 bg-dark-900 border-b border-white/10 px-4 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-medium text-slate-300 flex items-center space-x-1.5">
                                    <i data-lucide="globe" class="w-3.5 h-3.5 text-blue-400"></i>
                                    <span>Live Autonomous Application Preview</span>
                                </span>
                                <!-- Device Selector Switcher -->
                                <div class="flex items-center bg-dark-800 p-0.5 rounded-lg border border-white/10">
                                    <button @click="activePreviewDevice = 'desktop'" :class="activePreviewDevice === 'desktop' ? 'bg-purple-600 text-white' : 'text-slate-400'" class="p-1 rounded text-xs transition" title="Desktop View">
                                        <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button @click="activePreviewDevice = 'tablet'" :class="activePreviewDevice === 'tablet' ? 'bg-purple-600 text-white' : 'text-slate-400'" class="p-1 rounded text-xs transition" title="Tablet View">
                                        <i data-lucide="tablet" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button @click="activePreviewDevice = 'mobile'" :class="activePreviewDevice === 'mobile' ? 'bg-purple-600 text-white' : 'text-slate-400'" class="p-1 rounded text-xs transition" title="Mobile View">
                                        <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="flex items-center space-x-2">
                                <button @click="refreshPreview()" class="p-1.5 hover:bg-white/5 rounded-lg text-slate-400 hover:text-white transition" title="Refresh Sandbox">
                                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                                </button>
                                <button @click="openInNewTab()" class="p-1.5 hover:bg-white/5 rounded-lg text-slate-400 hover:text-white transition" title="Open Fullscreen">
                                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                                </button>
                                <button @click="currentView = 'ide'" class="px-2.5 py-1 bg-purple-600/20 text-purple-300 hover:bg-purple-600/30 border border-purple-500/30 rounded-lg text-xs font-medium transition flex items-center space-x-1">
                                    <i data-lucide="code" class="w-3 h-3"></i>

                    this.authModalOpen = true;

                    if (!this.userPrompt.trim() || this.isGenerating) return;
                    this.isGenerating = true;

                    // Reset steps status to active
                    this.agentSteps.forEach((step, idx) => {
                        step.status = idx === 0 ? 'active' : 'pending';
                    });

                    let currentStepIndex = 0;
                    const stepInterval = setInterval(() => {
                        if (currentStepIndex < this.agentSteps.length) {
                            if (currentStepIndex > 0) {
                                this.agentSteps[currentStepIndex - 1].status = 'completed';
                            }
                            this.agentSteps[currentStepIndex].status = 'active';
                            this.activeAgentStepName = this.agentSteps[currentStepIndex].name;
                            currentStepIndex++;
                        } else {
                            clearInterval(stepInterval);
                            this.agentSteps[this.agentSteps.length - 1].status = 'completed';
                            this.isGenerating = false;
                            this.activeAgentStepName = 'Execution Complete';
                            this.updatePreviewForPrompt(this.userPrompt);
                        }
                    }, 800);
                },

                updatePreviewForPrompt(prompt) {
                    const promptLower = prompt.toLowerCase();
                    if (promptLower.includes('android') || promptLower.includes('mobile')) {
                        this.activePreviewDevice = 'mobile';
                        this.currentPreviewHtml = `<!DOCTYPE html><html lang="en"><head><script src="https://cdn.tailwindcss.com"><\/script></head><body class="bg-slate-900 text-white p-6 font-sans"><div class="text-center space-y-4"><span class="px-2 py-1 bg-purple-500/20 text-purple-300 rounded text-xs">Android Native Build</span><h2 class="text-2xl font-bold">Mobile App Live</h2><div class="bg-slate-800 p-4 rounded-xl border border-white/10 text-left space-y-2"><p class="text-xs text-slate-400">Status: Running Flutter Runtime</p><div class="h-2 bg-purple-600 rounded-full w-3/4"></div></div></div></body></html>`;
                    } else if (promptLower.includes('python') || promptLower.includes('bot')) {
                        this.currentPreviewHtml = `<!DOCTYPE html><html lang="en"><head><script src="https://cdn.tailwindcss.com"><\/script></head><body class="bg-black text-emerald-400 p-6 font-mono text-xs"><p>[SYSTEM] Initializing Python Autonomous Scraping Script...</p><p>[EXEC] Fetching target endpoints...</p><p class="text-white">✔ Complete: Processed 4,200 data records in 0.84s.</p></body></html>`;
                    } else {
                        this.currentPreviewHtml = `<!DOCTYPE html><html lang="en"><head><script src="https://cdn.tailwindcss.com"><\/script></head><body class="bg-slate-950 text-white p-8 font-sans"><div class="max-w-4xl mx-auto text-center space-y-6"><span class="px-3 py-1 bg-purple-500/20 text-purple-300 rounded-full text-xs">Petable Automaton AI Output</span><h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">Autonomous SaaS Application</h1><p class="text-slate-400">Generated successfully for: "${prompt.substring(0, 45)}..."</p></div></body></html>`;
                    }
                },

                selectActiveFile(file) {
                    this.activeFileName = file.name;
                    if (file.name === 'index.html') {
                        this.activeFileContent = this.currentPreviewHtml;
                    } else if (file.name === 'app.js') {
                        this.activeFileContent = `// Petable Automaton AI Generated Script\nconsole.log("Petable Automaton Pipeline Online");\nfunction initApp() {\n  return { status: "Active" };\n}`;
                    } else if (file.name === 'styles.css') {
                        this.activeFileContent = `/* Custom Styles */\nbody {\n  margin: 0;\n  background: #07090e;\n}`;
                    }
                },

                createNewFile() {
                    const newName = prompt('Enter new file name (e.g. config.json):', 'config.json');
                    if (newName) {
                        this.projectFiles.push({ name: newName, icon: 'file-text' });
                    }
                },

                addWorkflowNode(type) {
                    const id = this.workflowNodes.length + 1;
                    this.workflowNodes.push({
                        id: id,
                        type: type,
                        label: `${id}. ${type} Action`,
                        desc: 'Automated workflow step configured.',
                        status: 'Active',
                        latency: '25ms'
